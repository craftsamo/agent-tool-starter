name: Publish release

# npm trusted publishing names this workflow file, so the npm and registry
# jobs stay here instead of moving to a workflow of their own.

on:
  # From the Actions tab: set the versions on main to the draft's with a
  # commit, build, and publish the draft on a release commit that carries the
  # built `dist`, then publish to npm and the MCP Registry. Consumers pin that
  # tag.
  workflow_dispatch:
  # A release published on the Releases page tags the commit the draft
  # targeted and builds nothing; the version on main follows afterwards. It has
  # no tag to publish, so the npm and registry jobs skip it.
  release:
    types: [published]

permissions: {}

env:
  # Let Corepack download the pinned pnpm without an interactive prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  # The version bump is pushed with the release deploy key, which
  # `repo-kit setup github` creates and lets bypass the protection of main.
  # `version-files` lists the same paths as `scripts/version-files.mjs`.
  release:
    permissions:
      contents: write
    uses: craftsamo/repo-kit/.github/workflows/release-publish.yml@v1
    with:
      version-files: |
        .codex-plugin/plugin.json
        .claude-plugin/plugin.json
        .antigravity-plugin/plugin.json
        plugin.yaml
      build-command: pnpm install --frozen-lockfile && pnpm run build
      artifacts: dist
      setup-pnpm: true
      node-version-file: .node-version
    secrets:
      RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}

  # A package.json with `"private": true` has nothing to publish, so the npm
  # and registry jobs skip it. The flag is read from the commit that was
  # dispatched, which the release does not change.
  package:
    name: Read package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      private: ${{ steps.read.outputs.private }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the private flag
        id: read
        run: echo "private=$(node -p 'require("./package.json").private === true')" >> "$GITHUB_OUTPUT"

  npm:
    name: Publish to npm
    needs: [release, package]
    if: >-
      needs.release.result == 'success' &&
      needs.package.outputs.private != 'true' &&
      github.event_name == 'workflow_dispatch'
    # One run at a time, so two releases cannot publish in the wrong order.
    concurrency:
      group: publish-npm
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token for npm trusted publishing, which needs no npm token and adds
    # a provenance statement.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later; the npm that comes with
      # the Node from `.node-version` is used as it is.
      - name: Check the npm version
        run: |
          version="$(npm --version)"
          if ! node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1)' "$version"; then
            echo "::error::npm $version is older than 11.5.1, which trusted publishing needs."
            exit 1
          fi
      - name: Check the version
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::$TAG tags a commit whose package.json is at $version."
            exit 1
          fi
      # The tag carries the built `dist`, and nothing is installed or run
      # while the job can request an OIDC token.
      - name: Check the tarball
        run: |
          built=(dist/mcp.js dist/cli.js dist/opencode.js)
          for file in "${built[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::$file is missing from the tagged commit."
              exit 1
            fi
          done
          pack="$RUNNER_TEMP/pack.json"
          npm pack --dry-run --json --ignore-scripts > "$pack"
          node -e '
            const [{ files }] = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))
            const packed = new Set(files.map((file) => file.path))
            const missing = process.argv.slice(2).filter((file) => !packed.has(file))
            if (missing.length > 0) {
              console.error(`::error::The tarball lacks ${missing.join(", ")}.`)
              process.exit(1)
            }
          ' "$pack" "${built[@]}"
      # A rerun after a later job failed finds the version already published
      # and goes on to the registry job. Only a version that does not exist
      # counts as unpublished; any other failure to read it stops the job.
      # npm refusing to overwrite a published version also counts as
      # published. npm holds a new publish (a manual one, say) as staged while
      # it validates it: npm view answers E404 and another publish is refused
      # as staged, so the job waits for npm view to show the version. One
      # staged for approval stays hidden until a maintainer approves it.
      - name: Publish the package
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          errors="$RUNNER_TEMP/view-errors"
          if npm view "$name@$version" version > /dev/null 2> "$errors"; then
            echo "$name@$version is already published; skipping the publish."
            exit 0
          fi
          grep -q E404 "$errors" || { cat "$errors" >&2; exit 1; }
          publish_errors="$RUNNER_TEMP/publish-errors"
          if npm publish --access public --ignore-scripts 2> "$publish_errors"; then
            exit 0
          fi
          if grep -q "You cannot publish over the previously published versions" "$publish_errors"; then
            echo "$name@$version is already published; skipping the publish."
            exit 0
          fi
          if ! grep -q "Cannot publish over previously staged version" "$publish_errors"; then
            cat "$publish_errors" >&2
            exit 1
          fi
          echo "npm holds $name@$version as staged; waiting for npm view to show it."
          for _ in $(seq 30); do
            if npm view "$name@$version" version --prefer-online > /dev/null 2>&1; then
              echo "npm shows $name@$version; it is published."
              exit 0
            fi
            sleep 10
          done
          echo "::error::npm still holds $name@$version as staged after five minutes. If it waits for approval, approve it under Staged Packages on npmjs.com or with npm stage approve, then re-run this job."
          exit 1

  mcp-registry:
    name: Publish to the MCP Registry
    needs: [release, package, npm]
    if: >-
      needs.npm.result == 'success' &&
      needs.package.outputs.private != 'true' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token for the registry's GitHub OIDC login, which proves the
    # `io.github.<owner>` namespace of the repository's owner without a token.
    permissions:
      contents: read
      id-token: write
    env:
      # The registry's publisher is pinned; change it deliberately.
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Write server.json
        run: node scripts/server-json.mjs
      # The registry looks the package up on npm, which may not answer for a
      # version published a moment ago; publishing before it does fails.
      - name: Wait for npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          for _ in $(seq 30); do
            if npm view "$name@$version" version --prefer-online > /dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::npm does not show $name@$version after five minutes."
          exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The archive is checked against the Sigstore bundle published with it,
      # which names the release workflow of the pinned tag.
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Authenticate to the MCP Registry
        run: mcp-publisher login github-oidc
      - name: Publish the server
        run: mcp-publisher publish
